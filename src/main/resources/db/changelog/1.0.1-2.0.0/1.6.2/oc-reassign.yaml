databaseChangeLog:
  - changeSet:
      id: create_table_oc_reassign_faction
      author: Bai
      changes:
        - createTable:
            tableName: torn_setting_oc_reassign_faction
            remarks: "帮派级大锅饭开关与收益模式配置"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  remarks: "主键ID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: faction_id
                  type: BIGINT
                  remarks: "帮派ID"
                  constraints:
                    nullable: false
              - column:
                  name: income_mode
                  type: VARCHAR(16)
                  remarks: "收益模式: COEFFICIENT(系数)/EQUAL(平分)"
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  remarks: "是否启用大锅饭"
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - addUniqueConstraint:
            tableName: torn_setting_oc_reassign_faction
            columnNames: faction_id
            constraintName: uk_setting_oc_reassign_faction_id
  - changeSet:
      id: create_table_oc_reassign_oc
      author: Bai
      changes:
        - createTable:
            tableName: torn_setting_oc_reassign_oc
            remarks: "帮派大锅饭OC范围行配置"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  remarks: "主键ID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: faction_id
                  type: BIGINT
                  remarks: "帮派ID"
                  constraints:
                    nullable: false
              - column:
                  name: oc_name
                  type: VARCHAR(64)
                  remarks: "OC名称"
                  constraints:
                    nullable: false
              - column:
                  name: rank
                  type: SMALLINT
                  remarks: "OC级别(冗余自目录, 便于审计, 与链表口径一致)"
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: TIMESTAMP
                  remarks: "生效时间, NULL表示历史所有月份均属大锅饭(原有名单语义)"
              - column:
                  name: enabled
                  type: BOOLEAN
                  remarks: "是否启用该范围行"
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - createIndex:
            tableName: torn_setting_oc_reassign_oc
            indexName: idx_setting_oc_reassign_oc_faction
            columns:
              - column:
                  name: faction_id
