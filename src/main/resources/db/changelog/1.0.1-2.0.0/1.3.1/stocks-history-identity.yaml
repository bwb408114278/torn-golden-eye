databaseChangeLog:
  # ========== 1. id列转为数据库自增(identity) ==========
  # 生产修复: insertRealtimeIgnoreConflict/insertBackfillReturningSlots 两条自定义批量INSERT
  # 不携带id列, 而该表存量主键一直由MyBatis-Plus应用层雪花算法生成, 数据库侧无默认值,
  # 导致实时采集自2026-08-19 13:25起每分钟报null value in column "id"错误, 分钟数据断流。
  # 转为GENERATED BY DEFAULT AS IDENTITY后主键由数据库生成(与torn_stock_market_round等表一致);
  # 该变更为元数据级操作, 不重写存量900万行数据。BY DEFAULT而非ALWAYS: 允许应用层显式携带id写入。
  - changeSet:
      id: add_identity_torn_stocks_history_id
      author: Bai
      changes:
        - sql:
            sql: "ALTER TABLE torn_stocks_history ALTER COLUMN id ADD GENERATED BY DEFAULT AS IDENTITY"

  # ========== 2. 自增起点对齐存量最大雪花ID ==========
  # identity序列默认从1起步, 而存量主键为雪花ID(最大约2.09e18), 若不对齐必与主键冲突;
  # setval后下一分配值为MAX(id)+1, 与潜在并存的雪花ID时间戳前沿保持安全间隔。
  - changeSet:
      id: setval_torn_stocks_history_identity_from_max_id
      author: Bai
      changes:
        - sql:
            sql: "SELECT setval(pg_get_serial_sequence('torn_stocks_history', 'id'), (SELECT COALESCE(MAX(id), 1) FROM torn_stocks_history))"
