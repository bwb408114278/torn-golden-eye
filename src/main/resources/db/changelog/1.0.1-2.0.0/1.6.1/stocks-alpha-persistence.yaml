databaseChangeLog:
  - changeSet:
      id: create_table_stock_alpha_daily_snapshot
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_alpha_daily_snapshot
            remarks: "保存α策略日线收盘、排名及来源快照"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID"
              - column:
                  name: stocks_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "股票ID"
              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: "Asia/Shanghai自然日"
              - column:
                  name: close_price
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "最后一根可用15分钟bar收盘价"
              - column:
                  name: source_bar_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: "日线来源15分钟bar ID"
              - column:
                  name: source_bar_start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "日线来源bar开始时间"
              - column:
                  name: stock_universe_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "股票池版本"
              - column:
                  name: alpha_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "α规则版本"
              - column:
                  name: r20
                  type: DECIMAL(18,10)
                  remarks: "20日收益"
              - column:
                  name: r1
                  type: DECIMAL(18,10)
                  remarks: "1日收益"
              - column:
                  name: r20_rank
                  type: DECIMAL(18,10)
                  remarks: "20日平均名次"
              - column:
                  name: r1_rank
                  type: DECIMAL(18,10)
                  remarks: "1日平均名次"
              - column:
                  name: r20_normalized
                  type: DECIMAL(18,10)
                  remarks: "20日归一化名次"
              - column:
                  name: r1_normalized
                  type: DECIMAL(18,10)
                  remarks: "1日归一化名次"
              - column:
                  name: alpha_score
                  type: DECIMAL(18,10)
                  remarks: "α综合评分"
              - column:
                  name: rank_position
                  type: INT
                  remarks: "最终排名"
              - column:
                  name: common_valid
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  remarks: "是否属于共同有效自然日"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: "删除标识"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_alpha_daily_snapshot_business ON torn_stock_alpha_daily_snapshot (stocks_id, business_date, stock_universe_version, alpha_rule_version) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_alpha_daily_snapshot_date ON torn_stock_alpha_daily_snapshot (business_date, common_valid)"
        - sql:
            sql: "ALTER TABLE torn_stock_alpha_daily_snapshot ADD CONSTRAINT ck_stock_alpha_daily_snapshot_close_positive CHECK (close_price > 0)"
  - changeSet:
      id: create_table_stock_alpha_decision
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_alpha_decision
            remarks: "保存α策略phase决策及执行消费状态"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID"
              - column:
                  name: decision_business_date
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: "决策自然日"
              - column:
                  name: common_day_index
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "共同有效自然日序号"
              - column:
                  name: phase
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "phase消费编号"
              - column:
                  name: decision_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "决策类型"
              - column:
                  name: current_batch_id
                  type: BIGINT
                  remarks: "当前α批次ID"
              - column:
                  name: selected_stocks_id
                  type: INT
                  remarks: "选中股票ID"
              - column:
                  name: source_snapshot_digest
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                  remarks: "来源快照摘要"
              - column:
                  name: execution_bar_start_time
                  type: TIMESTAMP
                  remarks: "执行bar开始时间"
              - column:
                  name: execution_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "执行状态"
              - column:
                  name: failure_reason
                  type: VARCHAR(512)
                  remarks: "失败原因"
              - column:
                  name: rebalance_batch_id
                  type: BIGINT
                  remarks: "换仓批次ID"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
                  remarks: "删除标识"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_alpha_decision_business ON torn_stock_alpha_decision (decision_business_date, phase) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_alpha_decision_status ON torn_stock_alpha_decision (execution_status, decision_business_date)"

  - changeSet:
      id: add_portfolio_code_to_stock_virtual_batch
      author: Bai
      changes:
        - addColumn:
            tableName: torn_stock_virtual_batch
            columns:
              - column:
                  name: portfolio_code
                  type: VARCHAR(64)
                  remarks: "批次所属逻辑组合编码"
        - sql:
            dbms: postgresql
            sql: "UPDATE torn_stock_virtual_batch SET portfolio_code = CASE WHEN ledger_type = 'FORMAL' THEN 'VIP_FORMAL' WHEN ledger_type = 'VIP_ALPHA' THEN 'VIP_ALPHA' WHEN ledger_type = 'SHADOW_FORMAL_CANDIDATE' THEN 'VIP_SHADOW_CANDIDATE' ELSE ledger_type END WHERE portfolio_code IS NULL"
        - addNotNullConstraint:
            tableName: torn_stock_virtual_batch
            columnName: portfolio_code
            columnDataType: VARCHAR(64)
        - sql:
            dbms: postgresql
            sql: "CREATE INDEX idx_stock_virtual_batch_portfolio_status ON torn_stock_virtual_batch (portfolio_code, batch_status, stocks_id)"
  - changeSet:
      id: add_alpha_decision_id_and_nullable_signal_event
      author: Bai
      changes:
        - addColumn:
            tableName: torn_stock_virtual_batch
            columns:
              - column:
                  name: alpha_decision_id
                  type: BIGINT
                  remarks: "α策略来源决策ID"
        - dropNotNullConstraint:
            tableName: torn_stock_virtual_batch
            columnName: signal_event_id
            columnDataType: BIGINT
        - sql:
            dbms: postgresql
            sql: "CREATE INDEX idx_stock_virtual_batch_alpha_decision ON torn_stock_virtual_batch (alpha_decision_id) WHERE alpha_decision_id IS NOT NULL AND deleted = 0"
