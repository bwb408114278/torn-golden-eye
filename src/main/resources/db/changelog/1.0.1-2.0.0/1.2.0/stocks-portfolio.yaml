databaseChangeLog:
  - changeSet:
      id: create_sequence_stock_market_bar_15m
      author: Bai
      changes:
        - createSequence:
            sequenceName: torn_stock_market_bar_15m_id_seq
            startValue: 1
            incrementBy: 1
  - changeSet:
      id: create_sequence_stock_strategy_feature_15m
      author: Bai
      changes:
        - createSequence:
            sequenceName: torn_stock_strategy_feature_15m_id_seq
            startValue: 1
            incrementBy: 1
  # ========== 表1: torn_stock_market_bar_15m ==========
  - changeSet:
      id: create_table_stock_portfolio_market_bar_15m
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_market_bar_15m
            remarks: "保存从分钟行情构建的标准15分钟市场bar和数据质量事实"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: "nextval('torn_stock_market_bar_15m_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID(数据库自增)"
              - column:
                  name: stocks_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "股票ID"
              - column:
                  name: stocks_shortname
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
                  remarks: "股票简称快照"
              - column:
                  name: bar_start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "15分钟桶开始时间"
              - column:
                  name: bar_end_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "15分钟桶结束时间(不含该时点)"
              - column:
                  name: first_sample_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "桶内第一条实际分钟采样时间"
              - column:
                  name: last_sample_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "桶内最后一条实际分钟采样时间"
              - column:
                  name: first_price
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "桶内第一条实际价格"
              - column:
                  name: last_price
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "桶内最后一条实际价格(决策/成交参考价)"
              - column:
                  name: low_price
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "桶内实际采样最低价"
              - column:
                  name: high_price
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "桶内实际采样最高价"
              - column:
                  name: sample_count
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "去重后的分钟采样数量"
              - column:
                  name: duplicate_count
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "构建时发现的重复分钟记录数量"
              - column:
                  name: tail_gap_seconds
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "桶结束到最后采样的秒数"
              - column:
                  name: usable
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  remarks: "是否满足正式bar可用标准"
              - column:
                  name: quality_reason
                  type: VARCHAR(64)
                  remarks: "不可用原因编码"
              - column:
                  name: build_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "bar构建规则版本"
              - column:
                  name: source_max_history_id
                  type: BIGINT
                  remarks: "本桶使用的最大原始历史ID"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_market_bar_15m_stock_time_ver ON torn_stock_market_bar_15m (stocks_id, bar_start_time, build_version) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_market_bar_15m_time_usable_ver ON torn_stock_market_bar_15m (bar_start_time, usable, build_version)"
        - sql:
            sql: "CREATE INDEX idx_stock_market_bar_15m_stock_time_desc ON torn_stock_market_bar_15m (stocks_id, bar_start_time DESC) WHERE deleted = 0"
        - sql:
            sql: "ALTER TABLE torn_stock_market_bar_15m ADD CONSTRAINT ck_bar_end_time CHECK (bar_end_time = bar_start_time + interval '15 minutes')"
        - sql:
            sql: "ALTER TABLE torn_stock_market_bar_15m ADD CONSTRAINT ck_bar_sample_count CHECK (sample_count >= 0 AND duplicate_count >= 0 AND tail_gap_seconds >= 0)"
        - sql:
            sql: "ALTER TABLE torn_stock_market_bar_15m ADD CONSTRAINT ck_bar_prices_positive CHECK (first_price > 0 AND last_price > 0 AND low_price > 0 AND high_price > 0)"

  # ========== 表2: torn_stock_strategy_feature_15m ==========
  - changeSet:
      id: create_table_stock_portfolio_strategy_feature_15m
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_strategy_feature_15m
            remarks: "保存指定15分钟bar时点的正式策略因果特征"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  defaultValueComputed: "nextval('torn_stock_strategy_feature_15m_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID(数据库自增)"
              - column:
                  name: stocks_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "股票ID"
              - column:
                  name: stocks_shortname
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
                  remarks: "股票简称快照"
              - column:
                  name: bar_start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "对应决策bar开始时间"
              - column:
                  name: reference_price
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "本bar最后一个实际价格"
              - column:
                  name: ma1d
                  type: DECIMAL(18,8)
                  constraints:
                    nullable: false
                  remarks: "1日bar均价"
              - column:
                  name: ma7d
                  type: DECIMAL(18,8)
                  constraints:
                    nullable: false
                  remarks: "7日bar均价"
              - column:
                  name: ma30d
                  type: DECIMAL(18,8)
                  constraints:
                    nullable: false
                  remarks: "30日bar均价"
              - column:
                  name: zscore1d
                  type: DECIMAL(18,8)
                  constraints:
                    nullable: false
                  remarks: "1日标准化偏离"
              - column:
                  name: zscore7d
                  type: DECIMAL(18,8)
                  constraints:
                    nullable: false
                  remarks: "7日标准化偏离"
              - column:
                  name: zscore30d
                  type: DECIMAL(18,8)
                  constraints:
                    nullable: false
                  remarks: "30日标准化偏离"
              - column:
                  name: return6h
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "6小时收益率"
              - column:
                  name: return1d
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "1日收益率"
              - column:
                  name: return7d
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "7日收益率"
              - column:
                  name: return14d
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "14日收益率"
              - column:
                  name: low30d
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "30日最低实际bar价格"
              - column:
                  name: high30d
                  type: DECIMAL(18,6)
                  constraints:
                    nullable: false
                  remarks: "30日最高实际bar价格"
              - column:
                  name: width30d
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "30日价格带宽"
              - column:
                  name: position30
                  type: DECIMAL(18,10)
                  remarks: "当前价格在30日区间的位置(高低价相同则空)"
              - column:
                  name: pct_above_30d_low
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "距30日低点涨幅"
              - column:
                  name: pct_below_30d_high
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "距30日高点跌幅"
              - column:
                  name: strategy_ready
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  remarks: "是否具备产生新买入信号的完整窗口"
              - column:
                  name: data_quality_reason
                  type: VARCHAR(64)
                  remarks: "特征不可用于买入的原因编码"
              - column:
                  name: feature_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "特征计算版本"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_strategy_feature_15m_stock_time_ver ON torn_stock_strategy_feature_15m (stocks_id, bar_start_time, feature_version) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_strategy_feature_15m_time_ready_ver ON torn_stock_strategy_feature_15m (bar_start_time, strategy_ready, feature_version)"
        - sql:
            sql: "CREATE INDEX idx_stock_strategy_feature_15m_stock_time_desc ON torn_stock_strategy_feature_15m (stocks_id, bar_start_time DESC) WHERE deleted = 0"
        - sql:
            sql: "ALTER TABLE torn_stock_strategy_feature_15m ADD CONSTRAINT ck_feature_reference_price CHECK (reference_price > 0)"
        - sql:
            sql: "ALTER TABLE torn_stock_strategy_feature_15m ADD CONSTRAINT ck_feature_low_high CHECK (low30d > 0 AND high30d > 0 AND high30d >= low30d)"
        - sql:
            sql: "ALTER TABLE torn_stock_strategy_feature_15m ADD CONSTRAINT ck_feature_width CHECK (width30d >= 0)"

  # ========== 表3: torn_stock_monthly_state ==========
  - changeSet:
      id: create_table_stock_portfolio_monthly_state
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_monthly_state
            remarks: "保存每支股票按月冻结的策略风格、成熟度、风险和证据快照"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID"
              - column:
                  name: stocks_id
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "股票ID"
              - column:
                  name: stocks_shortname
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
                  remarks: "股票简称快照"
              - column:
                  name: effective_month
                  type: DATE
                  constraints:
                    nullable: false
                  remarks: "生效月份(当月1日)"
              - column:
                  name: strategy_fit_prior
                  type: VARCHAR(32)
                  remarks: "最终策略适配风格编码(DRAFT允许空,CONFIRMED必须非空)"
              - column:
                  name: maturity
                  type: VARCHAR(32)
                  remarks: "成熟度编码(DRAFT允许空,CONFIRMED必须非空)"
              - column:
                  name: risk_level
                  type: VARCHAR(16)
                  remarks: "风险等级编码(DRAFT允许空,CONFIRMED必须非空)"
              - column:
                  name: suggested_personality
                  type: VARCHAR(32)
                  remarks: "机器建议风格(DRAFT允许空,CONFIRMED必须非空)"
              - column:
                  name: previous_personality
                  type: VARCHAR(32)
                  remarks: "上一期最终风格"
              - column:
                  name: manual_override
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  remarks: "是否人工覆盖机器建议"
              - column:
                  name: override_reason
                  type: VARCHAR(512)
                  remarks: "人工覆盖原因"
              - column:
                  name: metric_snapshot
                  type: JSONB
                  constraints:
                    nullable: false
                  remarks: "分类时完整指标快照(JSON文本)"
              - column:
                  name: personality_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "风格规则版本"
              - column:
                  name: risk_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "风险规则版本"
              - column:
                  name: evidence_start_time
                  type: TIMESTAMP
                  remarks: "证据窗口开始时间(DRAFT允许空,CONFIRMED必须非空)"
              - column:
                  name: evidence_end_time
                  type: TIMESTAMP
                  remarks: "证据窗口结束时间(DRAFT允许空,CONFIRMED必须非空)"
              - column:
                  name: state_status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                  remarks: "状态(DRAFT/CONFIRMED/RETIRED)"
              - column:
                  name: calculated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "机器计算时间"
              - column:
                  name: confirmed_at
                  type: TIMESTAMP
                  remarks: "人工确认时间"
              - column:
                  name: confirmed_by
                  type: VARCHAR(64)
                  remarks: "确认人标识"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_monthly_state_stock_month ON torn_stock_monthly_state (stocks_id, effective_month) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_monthly_state_month_status ON torn_stock_monthly_state (effective_month, state_status)"
        - sql:
            sql: "ALTER TABLE torn_stock_monthly_state ADD CONSTRAINT ck_monthly_effective_month CHECK (EXTRACT(DAY FROM effective_month) = 1)"
        - sql:
            sql: "ALTER TABLE torn_stock_monthly_state ADD CONSTRAINT ck_monthly_evidence_window CHECK (evidence_start_time IS NULL OR evidence_end_time IS NULL OR evidence_start_time <= evidence_end_time)"
        - sql:
            sql: "ALTER TABLE torn_stock_monthly_state ADD CONSTRAINT ck_monthly_confirmed_at CHECK (state_status != 'CONFIRMED' OR confirmed_at IS NOT NULL)"
        - sql:
            sql: "ALTER TABLE torn_stock_monthly_state ADD CONSTRAINT ck_monthly_confirmed_complete CHECK (state_status != 'CONFIRMED' OR (strategy_fit_prior IS NOT NULL AND maturity IS NOT NULL AND risk_level IS NOT NULL AND suggested_personality IS NOT NULL AND evidence_start_time IS NOT NULL AND evidence_end_time IS NOT NULL))"

  # ========== 表4: torn_stock_market_round ==========
  - changeSet:
      id: create_table_stock_portfolio_market_round
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_market_round
            remarks: "保存15分钟组合轮次的幂等、补偿和执行状态"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID"
              - column:
                  name: round_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "轮次对应bar开始时间"
              - column:
                  name: round_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "轮次状态编码"
              - column:
                  name: bar_build_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "使用的bar构建版本"
              - column:
                  name: feature_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "使用的特征版本"
              - column:
                  name: buy_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "买入规则版本"
              - column:
                  name: sell_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "卖出规则版本"
              - column:
                  name: allocation_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "资金和排序版本"
              - column:
                  name: message_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "消息规则版本"
              - column:
                  name: expected_stock_count
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "本轮预期股票数量"
              - column:
                  name: usable_stock_count
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "本轮可用于正式决策的股票数量"
              - column:
                  name: started_at
                  type: TIMESTAMP
                  remarks: "开始处理时间"
              - column:
                  name: completed_at
                  type: TIMESTAMP
                  remarks: "完成时间"
              - column:
                  name: attempt_count
                  type: INT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
                  remarks: "轮次处理尝试次数"
              - column:
                  name: error_message
                  type: VARCHAR(1000)
                  remarks: "最近失败摘要"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_market_round_time ON torn_stock_market_round (round_time) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_market_round_status_time ON torn_stock_market_round (round_status, round_time)"
        - sql:
            sql: "ALTER TABLE torn_stock_market_round ADD CONSTRAINT ck_round_attempt_count CHECK (attempt_count >= 0)"
        - sql:
            sql: "ALTER TABLE torn_stock_market_round ADD CONSTRAINT ck_round_stock_count CHECK (expected_stock_count >= 0 AND usable_stock_count >= 0 AND usable_stock_count <= expected_stock_count)"

  # ========== 表5: torn_stock_signal_state ==========
  - changeSet:
