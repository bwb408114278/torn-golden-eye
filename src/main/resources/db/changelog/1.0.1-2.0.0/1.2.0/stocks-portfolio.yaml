            sql: "CREATE INDEX idx_stock_virtual_batch_ledger_status_signal ON torn_stock_virtual_batch (ledger_type, batch_status, signal_time)"
        - sql:
            sql: "CREATE INDEX idx_stock_virtual_batch_stock_ledger_status ON torn_stock_virtual_batch (stocks_id, ledger_type, batch_status)"
        - sql:
            sql: "CREATE INDEX idx_stock_virtual_batch_entry_bar_status ON torn_stock_virtual_batch (expected_entry_bar_time, batch_status)"
        - sql:
            sql: "CREATE INDEX idx_stock_virtual_batch_exit_bar_status ON torn_stock_virtual_batch (expected_exit_bar_time, batch_status)"
        - sql:
            sql: "ALTER TABLE torn_stock_virtual_batch ADD CONSTRAINT ck_batch_quantity CHECK (quantity IS NULL OR quantity > 0)"
        - sql:
            sql: "ALTER TABLE torn_stock_virtual_batch ADD CONSTRAINT ck_batch_formal_prices CHECK (ledger_type != 'FORMAL' OR (signal_reference_price > 0 AND (entry_reference_price IS NULL OR entry_reference_price > 0) AND (exit_reference_price IS NULL OR exit_reference_price > 0)))"
        - sql:
            sql: "ALTER TABLE torn_stock_virtual_batch ADD CONSTRAINT ck_batch_formal_cash CHECK (ledger_type != 'FORMAL' OR (batch_status NOT IN ('OPEN','DATA_STALE','EXIT_PENDING','DATA_STALE_EXIT') OR (quantity IS NOT NULL AND quantity > 0 AND invested_cash IS NOT NULL AND invested_cash >= 0)))"
        - sql:
            sql: "ALTER TABLE torn_stock_virtual_batch ADD CONSTRAINT ck_batch_stale_duration_non_negative CHECK (stale_exit_duration_seconds IS NULL OR stale_exit_duration_seconds >= 0)"
        - sql:
            sql: "ALTER TABLE torn_stock_virtual_batch ADD CONSTRAINT ck_batch_admin_close_audit_complete CHECK (admin_close_reason IS NULL OR admin_close_reason != 'DATA_STALE_EXIT_RECOVERY_CLOSE' OR (original_exit_reason IS NOT NULL AND expected_exit_bar_time IS NOT NULL AND recovery_bar_start_time IS NOT NULL AND recovery_bar_end_time IS NOT NULL AND stale_exit_duration_seconds IS NOT NULL AND exit_time IS NOT NULL AND exit_reference_price IS NOT NULL))"
        - sql:
            sql: "ALTER TABLE torn_stock_virtual_batch ADD CONSTRAINT ck_batch_recovery_bar_consistency CHECK (recovery_bar_end_time IS NULL OR (recovery_bar_start_time IS NOT NULL AND recovery_bar_end_time > recovery_bar_start_time AND exit_time = recovery_bar_end_time))"

