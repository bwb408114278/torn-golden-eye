                    nullable: false
                  remarks: "截至本轮最大不利变动"
              - column:
                  name: peak_drawdown
                  type: DECIMAL(18,10)
                  constraints:
                    nullable: false
                  remarks: "截至本轮峰值回撤"
              - column:
                  name: formal_decision
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "正式持有/退出决定"
              - column:
                  name: formal_reason
                  type: VARCHAR(64)
                  remarks: "正式决定原因编码"
              - column:
                  name: dynamic_shadow_decision
                  type: VARCHAR(32)
                  remarks: "动态卖出影子决定"
              - column:
                  name: dynamic_shadow_reason
                  type: VARCHAR(64)
                  remarks: "动态影子原因编码"
              - column:
                  name: feature_snapshot
                  type: JSONB
                  constraints:
                    nullable: false
                  remarks: "本轮退出判断特征快照(JSON文本)"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_batch_mark_batch_round ON torn_stock_batch_mark (batch_id, round_time) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_batch_mark_round_decision ON torn_stock_batch_mark (round_time, formal_decision)"
        - sql:
            sql: "CREATE INDEX idx_stock_batch_mark_batch_round_desc ON torn_stock_batch_mark (batch_id, round_time DESC) WHERE deleted = 0"

  # ========== 表10: torn_stock_notice_audit ==========
  - changeSet:
      id: create_table_stock_portfolio_notice_audit
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_notice_audit
            remarks: "保存正式买卖和每日摘要的中文消息快照及本期一次发送结果"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID"
              - column:
                  name: notice_no
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
                  remarks: "通知编号"
              - column:
                  name: batch_id
                  type: BIGINT
                  remarks: "买卖通知关联批次"
              - column:
                  name: notice_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "通知类型(BUY/SELL/DAILY_SUMMARY)"
              - column:
                  name: scheduled_round_time
                  type: TIMESTAMP
                  remarks: "买卖通知来源轮次"
              - column:
                  name: summary_date
                  type: DATE
                  remarks: "每日摘要对应日期"
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: "发送目标群ID快照"
              - column:
                  name: payload_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                  remarks: "中文消息载荷SHA-256摘要"
              - column:
                  name: payload_snapshot
                  type: JSONB
                  constraints:
                    nullable: false
                  remarks: "消息结构和中文文本快照(JSON文本)"
              - column:
                  name: send_status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                  remarks: "发送状态(PENDING/SENT/FAILED)"
              - column:
                  name: send_attempt_count
                  type: INT
                  defaultValueNumeric: "0"
                  constraints:
                    nullable: false
                  remarks: "发送尝试次数"
              - column:
                  name: attempted_at
                  type: TIMESTAMP
                  remarks: "调用Bot时间"
              - column:
                  name: sent_at
                  type: TIMESTAMP
                  remarks: "当前调用判定成功时间"
              - column:
                  name: error_message
                  type: VARCHAR(1000)
                  remarks: "调用异常摘要"
              - column:
                  name: message_rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "中文模板和合并规则版本"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_notice_audit_no ON torn_stock_notice_audit (notice_no) WHERE deleted = 0"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_notice_audit_batch_type ON torn_stock_notice_audit (batch_id, notice_type) WHERE batch_id IS NOT NULL AND deleted = 0"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_notice_audit_summary_date_type ON torn_stock_notice_audit (summary_date, notice_type) WHERE notice_type = 'DAILY_SUMMARY' AND deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_notice_audit_status_create ON torn_stock_notice_audit (send_status, create_time)"
        - sql:
            sql: "ALTER TABLE torn_stock_notice_audit ADD CONSTRAINT ck_notice_attempt_count CHECK (send_attempt_count BETWEEN 0 AND 1)"
        - sql:
            sql: "ALTER TABLE torn_stock_notice_audit ADD CONSTRAINT ck_notice_batch_id CHECK (notice_type NOT IN ('BUY', 'SELL') OR batch_id IS NOT NULL)"
        - sql:
            sql: "ALTER TABLE torn_stock_notice_audit ADD CONSTRAINT ck_notice_summary_date CHECK (notice_type != 'DAILY_SUMMARY' OR summary_date IS NOT NULL)"

  # ========== sys_setting: 序列校准与VIP股票组合配置项初始化 ==========
  - changeSet:
      id: insert_stock_portfolio_sys_settings
      author: Bai
      changes:
        - sql:
            sql: "SELECT setval('sys_setting_id_seq', GREATEST((SELECT COALESCE(MAX(id), 0) FROM sys_setting), 1), true)"
        - insert:
            tableName: sys_setting
            columns:
              - column:
                  name: setting_key
                  value: "VIP_STOCK_ALERT_ENABLED"
              - column:
                  name: setting_value
                  value: "false"
        - insert:
            tableName: sys_setting
            columns:
              - column:
                  name: setting_key
                  value: "VIP_STOCK_FORMAL_NOTICE_ENABLED"
              - column:
                  name: setting_value
                  value: "false"
        - insert:
            tableName: sys_setting
            columns:
              - column:
                  name: setting_key
                  value: "VIP_STOCK_DAILY_SUMMARY_ENABLED"
              - column:
                  name: setting_value
                  value: "false"
        - insert:
            tableName: sys_setting
            columns:
              - column:
                  name: setting_key
                  value: "VIP_STOCK_RULE_MODE"
              - column:
                  name: setting_value
                  value: "SHADOW"
      preConditions:
        - onFail: HALT
        - onError: HALT
        - sqlCheck:
            sql: "SELECT COUNT(*) FROM sys_setting WHERE setting_key IN ('VIP_STOCK_ALERT_ENABLED', 'VIP_STOCK_FORMAL_NOTICE_ENABLED', 'VIP_STOCK_DAILY_SUMMARY_ENABLED', 'VIP_STOCK_RULE_MODE')"
            expectedResult: "0"

