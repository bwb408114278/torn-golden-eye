  # ========== torn_stock_signal_event: 追加拒绝观察理论退出生命周期列(单独changeSet,避免改写已执行changeSet) ==========
  - changeSet:
      id: add_theoretical_exit_columns_to_stock_signal_event
      author: Bai
      changes:
        - addColumn:
            tableName: torn_stock_signal_event
            columns:
              - column:
                  name: theoretical_entry_time
                  type: TIMESTAMP
                  remarks: "理论入场时间(拒绝观察理论路径入场bar的开始时间)"
              - column:
                  name: theoretical_entry_price
                  type: DECIMAL(18,6)
                  remarks: "理论入场价格(拒绝观察理论路径入场bar的lastPrice)"
              - column:
                  name: theoretical_exit_signal_time
                  type: TIMESTAMP
                  remarks: "理论退出信号时间(首次命中冻结退出规则的bar开始时间)"
              - column:
                  name: theoretical_exit_time
                  type: TIMESTAMP
                  remarks: "理论退出成交时间(退出信号后紧邻下一连续可用bar的开始时间)"
              - column:
                  name: theoretical_exit_price
                  type: DECIMAL(18,6)
                  remarks: "理论退出成交价格"
              - column:
                  name: theoretical_close_type
                  type: VARCHAR(32)
                  remarks: "理论退出关闭类型(冻结正式退出类型编码;无提前退出时为null)"
              - column:
                  name: theoretical_net_return
                  type: DECIMAL(18,10)
                  remarks: "理论净收益(扣0.1%卖出费;提前退出按退出价,否则按14天截止前最后可用bar期末价)"

