        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_virtual_batch_formal_slot ON torn_stock_virtual_batch (slot_id) WHERE ledger_type = 'FORMAL' AND batch_status IN ('ENTRY_PENDING','OPEN','DATA_STALE','EXIT_PENDING','DATA_STALE_EXIT') AND slot_id IS NOT NULL AND deleted = 0"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_virtual_batch_shadow_stock_strat_ver ON torn_stock_virtual_batch (stocks_id, primary_strategy, buy_rule_version) WHERE ledger_type = 'UNLIMITED_SHADOW' AND batch_status IN ('ENTRY_PENDING','OPEN','DATA_STALE','EXIT_PENDING','DATA_STALE_EXIT') AND deleted = 0"
