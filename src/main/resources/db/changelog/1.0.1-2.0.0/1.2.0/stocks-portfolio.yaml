              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_signal_state_stock_strat_ver ON torn_stock_signal_state (stocks_id, strategy_type, buy_rule_version) WHERE deleted = 0"
        - sql:
            sql: "CREATE INDEX idx_stock_signal_state_cooldown_reset ON torn_stock_signal_state (cooldown_until, reset_observed)"

  # ========== 表6: torn_stock_signal_event ==========
  - changeSet:
      id: create_table_stock_portfolio_signal_event
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_signal_event
            remarks: "保存全部原始信号、资格、排名、组合决定和后续研究结果"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID"
              - column:
                  name: event_no
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
