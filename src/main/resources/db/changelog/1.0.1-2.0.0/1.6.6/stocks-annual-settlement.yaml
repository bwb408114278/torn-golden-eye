databaseChangeLog:
  # VIP股票α正式仓年度结算台账：一行=(portfolio_code, settle_year, rule_version)的年度结算事实,
  # 同时承载"累计提取利润"科目;追加式只读事实,不产生任何资金划转,不写槽位与批次。
  - changeSet:
      id: create_table_stock_portfolio_annual_settlement
      author: Bai
      changes:
        - createTable:
            tableName: torn_stock_portfolio_annual_settlement
            remarks: "VIP股票α正式仓年度结算台账(年末边界权益与累计提取利润科目)"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                  remarks: "主键ID"
              - column:
                  name: portfolio_code
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "组合编码,本轮只允许VIP_ALPHA"
              - column:
                  name: settle_year
                  type: INT
                  constraints:
                    nullable: false
                  remarks: "被结算的自然年"
              - column:
                  name: boundary_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "年度边界时点=次年1月1日00:00(Asia/Shanghai)"
              - column:
                  name: boundary_bar_start_time
                  type: TIMESTAMP
                  remarks: "边界行情桶起点=被结算年12月31日23:45"
              - column:
                  name: boundary_bar_digest
                  type: VARCHAR(128)
                  remarks: "边界行情证明摘要(按stocksId升序以stocksId:barId:lastPrice逗号拼接后SHA-256)"
              - column:
                  name: initial_cash
                  type: DECIMAL(18,2)
                  remarks: "初始资金快照(正式仓10.00b)"
              - column:
                  name: opening_equity
                  type: DECIMAL(18,2)
                  remarks: "本年度基准=初始资金+累计已提取"
              - column:
                  name: closing_cash
                  type: DECIMAL(18,2)
                  remarks: "边界可用现金快照(只读)"
              - column:
                  name: closing_reserved
                  type: DECIMAL(18,2)
                  remarks: "边界预留资金快照(只读)"
              - column:
                  name: closing_market_value
                  type: DECIMAL(18,2)
                  remarks: "边界持仓可变现市值(已扣0.1%卖出费)"
              - column:
                  name: closing_equity
                  type: DECIMAL(18,2)
                  remarks: "年末边界权益"
              - column:
                  name: cumulative_extracted_before
                  type: DECIMAL(18,2)
                  remarks: "本次结算前累计已提取"
              - column:
                  name: extracted_amount
                  type: DECIMAL(18,2)
                  remarks: "本年提取额(可为负,负值表示账面利润被年度亏损回撤)"
              - column:
                  name: cumulative_extracted_after
                  type: DECIMAL(18,2)
                  remarks: "截至本年末累计已提取"
              - column:
                  name: year_return
                  type: DECIMAL(18,10)
                  remarks: "年度收益率=年末边界权益/本年度基准-1"
              - column:
                  name: coverage_days
                  type: INT
                  remarks: "区间自然日数"
              - column:
                  name: partial_year
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: "是否不完整年度(试运行)"
              - column:
                  name: annualized_return
                  type: DECIMAL(18,10)
                  remarks: "年化折算(ACT/365,仅展示;不适用时为null)"
              - column:
                  name: open_position_count
                  type: INT
                  remarks: "边界开放持仓批次数"
              - column:
                  name: settlement_status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "结算状态(PENDING_BOUNDARY/SETTLED/DEGRADED_PRICE_MISSING/DEGRADED_NOT_PROVABLE/BLOCKED_PRIOR_YEAR/MANUAL_REVIEW)"
              - column:
                  name: degrade_reason
                  type: VARCHAR(512)
                  remarks: "降级或阻断原因(可解释)"
              - column:
                  name: notice_id
                  type: BIGINT
                  remarks: "关联的年度报告通知审计行ID"
              - column:
                  name: notice_status
                  type: VARCHAR(32)
                  remarks: "年度报告通知状态快照"
              - column:
                  name: rule_version
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                  remarks: "结算口径版本"
              - column:
                  name: last_attempt_at
                  type: TIMESTAMP
                  remarks: "最近一次结算尝试时点"
              - column:
                  name: deleted
                  type: TINYINT
                  defaultValueComputed: '0'
                  constraints:
                    nullable: false
                  remarks: "删除标识 1为已删除"
              - column:
                  name: create_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "创建时间"
              - column:
                  name: update_time
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
                  remarks: "更新时间"

  # 年度结算业务唯一键与数据库层守恒兜底:SETTLED行必须字段齐全且满足提取恒等式。
  - changeSet:
      id: add_annual_settlement_constraints
      author: Bai
      changes:
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_annual_settlement_business ON torn_stock_portfolio_annual_settlement (portfolio_code, settle_year, rule_version) WHERE deleted = 0"
        - sql:
            sql: "ALTER TABLE torn_stock_portfolio_annual_settlement ADD CONSTRAINT ck_annual_settlement_settled_fields CHECK (settlement_status <> 'SETTLED' OR (boundary_bar_start_time IS NOT NULL AND boundary_bar_digest IS NOT NULL AND initial_cash IS NOT NULL AND opening_equity IS NOT NULL AND closing_cash IS NOT NULL AND closing_reserved IS NOT NULL AND closing_market_value IS NOT NULL AND closing_equity IS NOT NULL AND cumulative_extracted_before IS NOT NULL AND extracted_amount IS NOT NULL AND cumulative_extracted_after IS NOT NULL AND year_return IS NOT NULL AND coverage_days IS NOT NULL AND open_position_count IS NOT NULL))"
        - sql:
            sql: "ALTER TABLE torn_stock_portfolio_annual_settlement ADD CONSTRAINT ck_annual_settlement_extraction_identity CHECK (settlement_status <> 'SETTLED' OR (extracted_amount = closing_equity - cumulative_extracted_before - initial_cash AND cumulative_extracted_after = cumulative_extracted_before + extracted_amount AND opening_equity = initial_cash + cumulative_extracted_before AND closing_equity = closing_cash + closing_reserved + closing_market_value))"

  # 年度报告通知幂等键:同一被结算年度只允许一条年度报告审计行(与日报同名部分唯一索引同风格)。
  - changeSet:
      id: add_annual_settlement_notice_unique_index
      author: Bai
      changes:
        - sql:
            sql: "CREATE UNIQUE INDEX uk_stock_notice_audit_annual_settlement ON torn_stock_notice_audit (summary_date, notice_type) WHERE notice_type = 'ANNUAL_SETTLEMENT' AND deleted = 0"

  # ========== sys_setting: 扩宽配置键列宽(单独changeSet,避免改写已执行changeSet) ==========
  # 年度结算开关名 VIP_STOCK_ANNUAL_SETTLEMENT_ENABLED 为36字符,超出既有 setting_key VARCHAR(32);
  # 仅放宽列宽,不修改任何既有配置行。
  - changeSet:
      id: widen_sys_setting_key_to_64
      author: Bai
      changes:
        - modifyDataType:
            tableName: sys_setting
            columnName: setting_key
            newDataType: VARCHAR(64)
      rollback:
        - modifyDataType:
            tableName: sys_setting
            columnName: setting_key
            newDataType: VARCHAR(32)

  # ========== sys_setting: 追加VIP股票年度结算开关(单独changeSet,避免改写已执行changeSet) ==========
  - changeSet:
      id: insert_stock_annual_settlement_setting
      author: Bai
      changes:
        # 与既有插入同口径:身份列由数据库默认值生成,插入前先按现有最大ID校准序列,避免历史同步数据造成主键冲突
        - sql:
            sql: "SELECT setval('sys_setting_id_seq', GREATEST((SELECT COALESCE(MAX(id), 0) FROM sys_setting), 1), true)"
        - insert:
            tableName: sys_setting
            columns:
              - column:
                  name: setting_key
                  value: "VIP_STOCK_ANNUAL_SETTLEMENT_ENABLED"
              - column:
                  name: setting_value
                  value: "false"
      preConditions:
        - onFail: HALT
        - onError: HALT
        - sqlCheck:
            sql: "SELECT COUNT(*) FROM sys_setting WHERE setting_key = 'VIP_STOCK_ANNUAL_SETTLEMENT_ENABLED'"
            expectedResult: "0"
